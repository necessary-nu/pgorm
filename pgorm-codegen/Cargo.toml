[package]
name = "pgorm-codegen"
version = "0.2.0"
authors = ["Billy Chan <ccw.billy.123@gmail.com>"]
edition = "2024"
description = "Code Generator for pgorm"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/necessary-nu/pgorm"
documentation = "https://docs.rs/pgorm-codegen"
repository = "https://github.com/necessary-nu/pgorm"
categories = ["database"]
keywords = ["sql", "postgres", "codegen"]
rust-version = "1.89"

[lib]
name = "pgorm_codegen"
path = "src/lib.rs"

[features]
default = ["rust"]
# The Rust entity writer, `EntityWriter`, and what only it needs. Reading a
# schema into `Entities` needs none of it, so the Python and TypeScript
# writers' callers build with `default-features = false` and compile no
# Rust writer.
rust = ["dep:syn", "dep:quote", "dep:prettyplease", "dep:proc-macro2"]

[dependencies]
pgorm-query.workspace = true
# libpg_query, the PostgreSQL server's own parser, is a plain dependency here:
# pgorm-codegen is a build-time tool nothing links into a running application,
# so the C build cost lands on people generating entities and on nobody else.
# It is the root crate's pg_query fork at the root's revision, so a schema is
# read with the grammar the server it describes speaks; the root manifest says
# why it is a git dependency.
pg_query = { git = "https://github.com/necessary-nu/pg_query.rs.git", rev = "09ebc3a4c7f50f3682e890a8372b4c4c99382ed9" }
# The Rust writer's: it builds generated source as tokens (proc-macro2 and
# quote) and parses it back as a syntax tree (syn) to lay it out.
syn = { version = "3", default-features = false, features = ["parsing", "proc-macro", "derive", "printing", "full"], optional = true }
# Generated Rust files are written formatted, as a person writes Rust, so a
# program needs no rustfmt step after generating; prettyplease is the
# formatter that runs in-process over a syntax tree, where rustfmt is a tool.
prettyplease = { version = "0.3", default-features = false, optional = true }
quote = { version = "1.0.47", default-features = false, optional = true }
heck = { version = "0.5", default-features = false }
# A TypeScript model's `renameAll: "snake_case"` names its columns by the
# conversion the bindings' models and the derives rename by.
pgorm-case-style = { version = "0.2.0", path = "../pgorm-case-style" }
# A declared model's names are held to Python's and JavaScript's identifier
# rules, which are Unicode's identifier properties.
unicode-ident = { version = "1", default-features = false }
proc-macro2 = { version = "1.0.107", default-features = false, optional = true }
tracing = { version = "0.1.44", default-features = false, features = ["log"] }
# A numeric literal in a column's DEFAULT or generation expression is read as
# the exact decimal it spells, not rounded through a float.
rust_decimal = { version = "1.43", default-features = false }

[dev-dependencies]
pretty_assertions = { version = "1.4" }
# `std` gives the tests `subscriber::with_default`, which records the
# warnings the crate reports.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
# `postgres-array` lets a generated entity's `Vec<T>` field compile here, as
# a fixture holding an array column has to; `with-jiff` gives a temporal
# field its prelude name, and `with-json` the serde impls a fixture generated
# under `with_serde` needs of every field (tests/serde_values_tests.rs).
pgorm = { path = "../", default-features = false, features = ["macros", "postgres-array", "with-jiff", "with-json"] }
serde = { workspace = true }
serde_json = { version = "1.0.151" }
