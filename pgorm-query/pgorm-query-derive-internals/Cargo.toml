[package]
name = "pgorm-query-derive-internals"
version = "0.2.0"
authors = [ "Follpvosten <wolfi@karpador.xyz>", "Rene Leveille <rene@nestingsafe.com>" ]
edition = "2024"
description = "The expansion of the SqlName and StaticName derives, shared by pgorm-query-derive and pgorm-macros"
license = "MIT OR Apache-2.0"
documentation = "https://docs.rs/pgorm-query"
repository = "https://github.com/pgorm-rs/pgorm"
categories = [ "database" ]
keywords = ["database", "sql", "postgres"]
rust-version = "1.89"

# An ordinary library rather than a proc-macro crate: a proc-macro crate exports
# only its macros, so the two crates defining these derives — pgorm-query-derive,
# whose expansion names `pgorm_query`, and pgorm-macros, whose names
# `pgorm::pgorm_query` — share one implementation through this crate and pass
# it the path the trait is reached by.
[dependencies]
syn = { version = "3", default-features = false, features = ["parsing", "derive", "printing", "clone-impls"] }
quote = { version = "1.0.47", default-features = false }
heck = { version = "0.5", default-features = false }
proc-macro2 = { version = "1.0.107", default-features = false }
thiserror = { version = "2.0", default-features = false }
