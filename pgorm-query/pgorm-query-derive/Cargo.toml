[package]
name = "pgorm-query-derive"
version = "0.2.0"
authors = [ "Follpvosten <wolfi@karpador.xyz>", "Rene Leveille <rene@nestingsafe.com>" ]
edition = "2024"
description = "Derive macro for pgorm-query's SqlName trait"
license = "MIT OR Apache-2.0"
documentation = "https://docs.rs/pgorm-query"
repository = "https://github.com/necessary-nu/pgorm"
categories = [ "database" ]
keywords = ["database", "sql", "postgres"]
rust-version = "1.89"

[lib]
proc-macro = true

[dependencies]
pgorm-query-derive-internals = { version = "0.2.0", path = "../pgorm-query-derive-internals" }
syn = { version = "3", default-features = false, features = ["parsing", "proc-macro", "derive", "printing"] }
quote = { version = "1.0.47", default-features = false }

[dev-dependencies]
trybuild = "1.0.122"
pgorm-query.workspace = true
strum = { version = "0.28", features = ["derive"] }

[features]
