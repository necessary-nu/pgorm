[package]
name = "pgorm-query"
version = "0.2.0"
authors = [
    "Chris Tsang <chris.2y3@outlook.com>",
    "Billy Chan <ccw.billy.123@gmail.com>",
    "Ivan Krivosheev <py.krivosheev@gmail.com>",
]
edition = "2024"
description = "A dynamic query builder for Postgres"
license = "MIT OR Apache-2.0"
documentation = "https://docs.rs/pgorm-query"
repository = "https://github.com/necessary-nu/pgorm"
categories = ["database"]
keywords = ["database", "sql", "postgres"]
rust-version = "1.89"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "pgorm_query"
path = "src/lib.rs"

[dependencies]
inherent = "1.0.14"
pgorm-query-attr = { version = "0.2.0", path = "pgorm-query-attr", default-features = false, optional = true }
pgorm-query-derive = { version = "0.2.0", path = "pgorm-query-derive", default-features = false, optional = true }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
postgres-types = { version = "0.2.14", default-features = false }
pgvector = { version = "0.4.2", default-features = false, features = ["postgres"] }
rust_decimal = { version = "1.43", default-features = false }
uuid = { version = "1.27", default-features = false }
ipnetwork = { version = "0.21.1", default-features = false }
mac_address = { version = "1.2.0", default-features = false }
# `Serialize` and `Deserialize` for `Interval`, `Range` and `Multirange`
# ([spec:pgorm:def:sql.value.interval+3], [spec:pgorm:def:sql.value.range]),
# behind the `serde` feature. A range's impls are generic over its subtype, so
# whether `Range<Decimal>` serializes is rust_decimal's own `serde` feature,
# which pgorm's `with-json` turns on beside this one.
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"], optional = true }

[dev-dependencies]
pgorm-query = { workspace = true, features = ["tests-cfg", "serde"] }
criterion = { version = "0.8" }
pretty_assertions = { version = "1.4" }
# The render oracle (tests/postgres/oracle.rs) parses with pgsql-syntax at the
# root crate's revision, so a render is held to the grammar the runtime parses
# with. The root manifest says why it is a git dependency.
pgsql-syntax = { git = "https://github.com/necessary-nu/pgsql-rs.git", rev = "9f15dec2433c4139117f68392b9b3b61b154bb6b" }
# The surface tests (tests/surface) read lib.rs as a syntax tree, and hold
# what a caller cannot name with compile-fail fixtures.
syn = { version = "3", default-features = false, features = ["parsing", "full"] }
trybuild = "1.0.122"

[features]
default = ["derive"]
derive = ["pgorm-query-derive"]
attr = ["pgorm-query-attr"]
tests-cfg = []
serde = ["dep:serde"]
all-features = [
    "derive",
    "attr",
    "serde",
]

[[test]]
name = "test-derive"
path = "tests/derive/mod.rs"
required-features = ["derive"]

[[test]]
name = "test-error"
path = "tests/error/mod.rs"
required-features = ["tests-cfg"]

[[test]]
name = "test-postgres"
path = "tests/postgres/mod.rs"
required-features = ["tests-cfg"]

[[test]]
name = "test-surface"
path = "tests/surface/mod.rs"

[[bench]]
name = "basic"
harness = false
