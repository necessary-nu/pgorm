[package]
name = "pgorm-sql-macro"
version = "0.2.0"
authors = []
edition = "2024"
description = "Compile-time PostgreSQL grammar validation for raw SQL and PRQL string literals"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/necessary-nu/pgorm"
documentation = "https://docs.rs/pgorm-sql-macro"
repository = "https://github.com/necessary-nu/pgorm"
categories = ["database"]
keywords = ["postgres", "sql", "macro"]
rust-version = "1.89"

[lib]
name = "pgorm_sql_macro"
path = "src/lib.rs"
proc-macro = true

[dependencies]
# The grammar check and the PRQL compiler, shared with pgorm's run-time
# checks so a refusal reads the same at compile time and at run time.
pgorm-sql-check = { version = "0.2.0", path = "../pgorm-sql-check" }
proc-macro2 = { version = "1.0.107", default-features = false }
quote = { version = "1.0.47", default-features = false }
syn = { version = "3", default-features = false, features = ["full", "parsing", "proc-macro", "printing"] }

[dev-dependencies]
pgorm = { path = ".." }
pgorm-sql-macro = { path = "." }
trybuild = "1.0.122"
