[workspace]
members = [".", "crates/pgorm-driver", "crates/pgorm-driver-rustls", "pgorm-case-style", "pgorm-macros", "pgorm-codegen", "pgorm-migration", "pgorm-pool", "pgorm-query", "pgorm-query/pgorm-query-attr", "pgorm-query/pgorm-query-derive", "pgorm-query/pgorm-query-derive-internals", "pgorm-sql-check", "pgorm-sql-macro", "pgorm-test-support", "pgorm-guide-support", "pgorm-bindings"]

[package]
name = "pgorm"
version = "0.2.0"
authors = []
edition = "2024"
description = "An async ORM for PostgreSQL"
license = "MIT OR Apache-2.0"
documentation = "https://docs.rs/pgorm"
repository = "https://github.com/necessary-nu/pgorm"
categories = ["database"]
keywords = ["async", "orm", "postgres"]
rust-version = "1.89"

[package.metadata.docs.rs]
features = ["default", "postgres-array", "tests-cfg", "metrics-fingerprint"]
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "pgorm"
path = "src/lib.rs"

[workspace.dependencies]
async-trait = { version = "0.1.92", default-features = false }
deadpool = { version = "0.13.1", features = ["serde", "rt_tokio_1"] }
serde = { version = "1.0.229", default-features = false, features = ["derive", "rc"] }
tokio = { version = "1.53", features = ["full"] }
tracing = { version = "0.1.44", default-features = false, features = ["attributes", "log"] }
pgorm-driver = { path = "crates/pgorm-driver", version = "0.2.0", features = ["with-uuid-1", "with-jiff-0_2", "with-serde_json-1", "array-impls"] }
pgorm-query = { path = "./pgorm-query", default-features = false, features = ["derive"] }

[dependencies]
pgorm-pool = { path = "./pgorm-pool" }
# The case styles a run-time model's `rename_all` renames its columns by, the
# ones the derives rename an entity's by.
pgorm-case-style = { version = "0.2.0", path = "./pgorm-case-style" }
async-stream = { version = "0.3.6", default-features = false }
async-trait.workspace = true
deadpool.workspace = true
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
pgorm-driver.workspace = true
# Required, not optional, for the reason `rust_decimal` below is: `Value::Date`,
# `Time`, `DateTime` and `DateTimeWithTimeZone` are unconditional variants of
# `pgorm-query`'s value model, and the always-built bind path encodes a naive
# datetime itself, naming jiff's civil types to do it. jiff is compiled in
# every configuration anyway — `pgorm-query` and pgorm-driver's
# `with-jiff-0_2` both depend on it — so `with-jiff` gates the conversion
# surface (`TryGetable`, `IntoActiveValue`, the prelude names), not the crate.
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
futures = { version = "0.3.34", default-features = false, features = ["std"] }
log = { version = "0.4.34", default-features = false }
# Required, not optional. `Value::Decimal` is an unconditional variant of
# `pgorm-query`'s value model and the `ValueHolder` bind path is always built,
# so `Decimal` has to be bindable in every configuration — its `numeric`
# encoding is also how every integer and float reaches a `numeric` placeholder.
# `db-tokio-postgres` carries that `ToSql` impl and only this dependency edge
# turns it on; `pgorm-query` takes the same crate without it.
rust_decimal = { version = "1.43", features = ["db-tokio-postgres"], default-features = false }
# PostgreSQL 19's grammar, parsed natively in Rust: the paginator reads raw
# statements with it, `metrics-fingerprint` hashes with it, COPY's guard scans
# with it, and the `sql!` / `prql!` macros, codegen's DDL path and the render
# and identifier oracles all parse with it, so every one of them speaks the one
# grammar it carries. pgsql-syntax ports pg_query.rs 18.1.0's
# API (parse, deparse, normalize, fingerprint, scan) to pgsql-parser, a Rust
# port of PostgreSQL 19.0's scanner and parser built from the release's own
# Bison tables, so nothing here compiles C or runs bindgen.
#
# It is a git dependency because pgsql-rs publishes nothing (its crates are
# `publish = false`), pinned to one commit of its main branch. The cost is the
# one prqlc's states below — `cargo publish` refuses a git dependency — and
# the revision is held the same way: pgorm-sql-check, pgorm-codegen and
# pgorm-query's oracle name the same commit, and tests/fork_pin_tests.rs holds
# every declaration and every committed lockfile to it.
pgsql-syntax = { git = "https://github.com/necessary-nu/pgsql-rs.git", rev = "9f15dec2433c4139117f68392b9b3b61b154bb6b" }
pgorm-macros = { version = "0.2.0", path = "pgorm-macros", default-features = false }
pgorm-sql-check = { version = "0.2.0", path = "pgorm-sql-check" }
pgorm-sql-macro = { version = "0.2.0", path = "pgorm-sql-macro" }
# The PRQL compiler behind pgorm::pipeline. Pure Rust but a heavyweight
# compile; a permanent dependency by decision, like pgsql-syntax above. The pin
# is exact: the PL AST is not a stable API, and the adapter module is
# written against this one revision.
#
# It is a git dependency on the fork's pgorm/upstream-2026-11 branch: upstream
# PRQL's main at 0d4c6efe, with fixes to its SQL generation that upstream has
# not taken on top:
#   - star expansion is ordered totally, so one pipeline compiles to one
#     projection, the tuple layout a positional decode reads (reproducer: the
#     pipeline-join-distinct-order finding);
#   - the sort a `take` carries is tracked through anchoring, and a relation's
#     interior columns map to the ones its reader exposes, so an inherited
#     ORDER BY names a column and a relation that exist;
#   - a quoted identifier doubles every delimiter, so distinct names stay
#     distinct;
#   - a wildcard used as a key keeps its table prefix, and grouping by one
#     writes a whole-row key with every named column the query reads written
#     beside it, and is refused at compile time where the star itself is read
#     outside an aggregation;
#   - literal keys are left out of GROUP BY and DISTINCT ON, where PostgreSQL
#     would read an integer as a column position;
#   - DISTINCT ON orders by a key's expression when the projection drops it;
#   - std's `intersect` and `remove` are relation-level set operations, as
#     `append` is, and a stage after a set operation reads the whole combined
#     relation.
# The pinned commit is the branch's last, which drops chrono, declared
# unmaintained by RUSTSEC-2026-0543: prqlc splits `date.to_text` format
# strings itself, as chrono did, and takes its debug log's timestamps from
# jiff.
# A dependency rather than a `[patch.crates-io]` entry, because a dependency
# travels with pgorm and a patch does not: cargo reads patches from the root
# of the workspace being built and nowhere else, so every detached workspace,
# every compile-suite crate the campaign generates and every downstream
# consumer would resolve stock prqlc from crates.io unless it repeated the
# table.
#
# The cost is publication: `cargo publish` refuses a git dependency with no
# registry version, and giving it one would hand every crates.io consumer the
# stock compiler this exists to avoid, so pgorm is not publishable to
# crates.io while this stands. pgorm-sql-check names the same revision, and
# tests/fork_pin_tests.rs holds every declaration and every committed
# lockfile to it.
prqlc = { git = "https://github.com/necessary-nu/prql.git", rev = "ba66e3a36c5b64872d5624f65c25f46c4afab98a", default-features = false }
pgorm-query.workspace = true
strum = { version = "0.28", default-features = false }
serde_json = { version = "1.0.151", default-features = false, optional = true }
uuid = { version = "1.27", default-features = false, optional = true }
url = { version = "2.5", default-features = false }
thiserror = { version = "2.0", default-features = false }
bytes = "1.12"
postgres-protocol = { version = "0.6.12", default-features = false }

[dev-dependencies]
futures = { version = "0.3.34" }
tokio = { version = "1.53", features = ["full"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
pgorm = { path = ".", features = ["tests-cfg", "postgres-array", "metrics-fingerprint"] }
pretty_assertions = { version = "1.4" }
uuid = { version = "1.27", features = ["v4"] }
arraystring = "0.3"
dotenvy = "0.15.7"
ipnetwork = "0.21.1"
mac_address = "1.2.0"
pgvector = { version = "0.4.2", default-features = false }
toml = "1.1"
# The identifier render oracle registers the migration ledger's custom table
# name, which only the migrator renders (tests/identifier_oracle/live_capture.rs).
pgorm-migration = { path = "pgorm-migration" }
# Run-scoped names for the databases and roles the live tests create, and the
# sweep of crashed runs' leftovers (tests/common/setup).
pgorm-test-support = { path = "pgorm-test-support" }
# The bakery schema and scratch databases the user guide's examples run in
# (docs/guide), and the crates whose chapters run their own examples.
pgorm-guide-support = { path = "pgorm-guide-support" }
pgorm-codegen = { path = "pgorm-codegen" }

[features]
default = [
    "macros",
    "with-json",
    "with-jiff",
    "postgres-array",
    "with-uuid",
]
macros = ["pgorm-macros/derive"]
# Off by default: fingerprinting costs a parse per statement, so only builds
# that want query identities in their metrics pay for it. The parser itself is
# linked either way (see `pgsql-syntax` above).
metrics-fingerprint = []
# A Model deriving `Serialize` / `Deserialize` (`from_json`, codegen's
# `with_serde`) needs each field's type to serialize: the temporal, uuid and
# numeric payloads do through their crates' `serde` features, and
# pgorm-query's `Interval`, `Range` and `Multirange` through its own.
with-json = ["serde_json", "jiff/serde", "uuid?/serde", "rust_decimal/serde", "pgorm-query/serde"]
with-jiff = []
with-uuid = ["uuid"]
postgres-array = []
tests-cfg = []
