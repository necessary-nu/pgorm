[package]
name = "pgorm-generative-replay"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
license = "MIT OR Apache-2.0"
description = "Standalone replay harness for the pgorm generated-program campaign"

# A detached workspace: the harness resolves against its own lock, depends on
# the checkout under test by path, and never pulls campaign tooling — or
# libpython — into an ordinary pgorm build.
[workspace]

[lib]
name = "pgorm_generative_replay"
path = "src/lib.rs"

[dependencies]
pgorm = { path = "../../.." }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
# `raw_value` backs the decoder's numeric-fidelity check; `float_roundtrip`
# keeps a JSON float's shortest representation across decode and re-render.
serde_json = { version = "1.0.151", features = ["raw_value", "float_roundtrip"] }
pgorm-driver = { path = "../../../crates/pgorm-driver", version = "0.2.0" }
# A streamed step observes a bounded prefix, so the harness has to drive
# `RowStream` item by item rather than collect it.
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
rust_decimal = "1.43.0"
uuid = "1.27.0"
bytes = "1.12.1"
# fallible-iterator stays on 0.2: postgres-protocol 0.6.12, the latest release,
# hands its array and range iterators out through 0.2's `FallibleIterator`, and
# 0.3's is a different trait those types do not implement.
fallible-iterator = "0.2.0"
postgres-protocol = "0.6.12"
async-trait = "0.1.92"

[dev-dependencies]
# The variants of pgorm-query's open enums, behind its hidden tests-cfg
# feature, which the harness's tests walk its encoder through.
pgorm-query = { path = "../../../pgorm-query", default-features = false, features = ["tests-cfg"] }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
missing_panics_doc = "deny"
# The report is written to stdout by contract, at exactly one site.
print_stdout = "deny"
print_stderr = "deny"
