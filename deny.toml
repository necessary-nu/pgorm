# Supply-chain policy for the dependency tree.
#
# Until this file existed the repository had no way to learn that a dependency
# had picked up a published advisory: nothing scanned, and the first notice
# would have been someone reading a mailing list. `cargo deny check` answers
# four separate questions, and the one worth having is `advisories`.
#
# The allow lists below are derived from `cargo deny list` over the tree as it
# stands, not copied from a template. A license appearing here means it is
# already present and was read; a new one failing the check is the point.

[advisories]
# A crate withdrawn from the registry after we pinned it is a supply-chain
# event whether or not it also carries an advisory, so it fails rather than
# warns.
yanked = "deny"
ignore = []

[licenses]
# Every license below is permissive and already in the tree. `r-efi` is the
# only crate offering a copyleft option (LGPL-2.1-or-later); it is licensed
# MIT OR Apache-2.0 OR LGPL-2.1-or-later, so omitting LGPL here selects one of
# the permissive alternatives rather than excluding the crate. `PostgreSQL`
# came with pgsql-rs, whose parser is ported from PostgreSQL's own source.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "PostgreSQL",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

# pgsql-rs's internal crates. Six declare no license, and none carries a
# license file of its own: the workspace's two, `LICENSE` (libpg_query's
# BSD-3-Clause, the operations and codecs ported from it) and
# `LICENSE-PostgreSQL` (the PostgreSQL License, the scanner, grammar and
# PL/pgSQL ported from the server), sit at its root, and the README names them
# as the licenses of the code the workspace includes. Each crate here is read
# under both, the expression its siblings `pg19-nodes`, `pg19-parser` and
# `pgsql-parser` declare. The paths are relative to each crate's directory, and
# the hashes hold the files to the text read at the pinned revision.
[[licenses.clarify]]
crate = "pg19-codec"
expression = "BSD-3-Clause AND PostgreSQL"
license-files = [
    { path = "../../LICENSE", hash = 0xa1c5ff14 },
    { path = "../../LICENSE-PostgreSQL", hash = 0xaca84184 },
]

[[licenses.clarify]]
crate = "pg19-engine"
expression = "BSD-3-Clause AND PostgreSQL"
license-files = [
    { path = "../../LICENSE", hash = 0xa1c5ff14 },
    { path = "../../LICENSE-PostgreSQL", hash = 0xaca84184 },
]

[[licenses.clarify]]
crate = "pg19-lexer"
expression = "BSD-3-Clause AND PostgreSQL"
license-files = [
    { path = "../../LICENSE", hash = 0xa1c5ff14 },
    { path = "../../LICENSE-PostgreSQL", hash = 0xaca84184 },
]

[[licenses.clarify]]
crate = "pg19-operations"
expression = "BSD-3-Clause AND PostgreSQL"
license-files = [
    { path = "../../LICENSE", hash = 0xa1c5ff14 },
    { path = "../../LICENSE-PostgreSQL", hash = 0xaca84184 },
]

[[licenses.clarify]]
crate = "pg19-plpgsql"
expression = "BSD-3-Clause AND PostgreSQL"
license-files = [
    { path = "../../LICENSE", hash = 0xa1c5ff14 },
    { path = "../../LICENSE-PostgreSQL", hash = 0xaca84184 },
]

[[licenses.clarify]]
crate = "pg19-tables"
expression = "BSD-3-Clause AND PostgreSQL"
license-files = [
    { path = "../../LICENSE", hash = 0xa1c5ff14 },
    { path = "../../LICENSE-PostgreSQL", hash = 0xaca84184 },
]

[bans]
# Duplicate versions are a transitive fact we mostly cannot act on — the tree
# carries two `thiserror`, two `rustix` and three `itertools` majors because
# its dependencies do. Worth seeing, not worth failing a build over.
multiple-versions = "warn"
# A wildcard on a registry crate accepts whatever that registry serves next and
# is a genuine supply-chain hazard. Every wildcard in this tree today is instead
# a workspace member referring to another by path, which resolves from disk and
# consults no registry.
#
# `allow-wildcard-paths` does not cover them, because the crates holding them
# are publishable — none of pgorm, pgorm-pool, pgorm-query, pgorm-macros,
# pgorm-sql-check or pgorm-sql-macro sets `publish = false`, and crates.io rejects a path
# dependency carrying no version. That is a real defect, but it is a defect in
# releasing rather than in supply chain: `cargo publish` would fail on it, and
# the fix is either a version alongside each path or an explicit
# `publish = false`. Which one is a decision about how this fork is
# distributed, so the check reports rather than blocks and the question stays
# visible instead of being settled here by a config edit.
wildcards = "warn"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Two git repositories are the dependencies not resolved from crates.io:
# prqlc (necessary-nu/prql, a fork of the compiler behind pgorm::pipeline and
# `prql!`) and pgsql-syntax (necessary-nu/pgsql-rs, PostgreSQL 19's grammar in
# native Rust, which publishes nothing). Listing each here is what makes it a
# reviewed exception instead of an unremarked git dependency, so adding one has
# to be a deliberate edit to this file. The second was one: the operator's
# decision of 2026-11-23 to parse with pgsql-rs (plan node pg-query-19). The
# root Cargo.toml says what each carries, and
# tests/fork_pin_tests.rs holds every declaration and lockfile to one revision
# of each.
allow-git = ["https://github.com/necessary-nu/prql", "https://github.com/necessary-nu/pgsql-rs"]
