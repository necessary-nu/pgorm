[package]
name = "pgorm-migration"
version = "0.2.0"
authors = []
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.89"
publish = false

[dependencies]
async-trait = { version = "0.1.92", default-features = false }
pgorm = { path = "..", features = ["macros"] }
# The `MigrationName` derive, re-exported beside the trait it implements.
pgorm-macros = { version = "0.2.0", path = "../pgorm-macros", default-features = false, features = ["derive"] }
# The compile-time half of `sql_migration!`: it reads and checks the file
# through the same libpg_query oracle as `pgorm::sql!`.
pgorm-sql-macro = { version = "0.2.0", path = "../pgorm-sql-macro" }
# The digest a SQL-file migration reports as its checksum; already in the
# dependency graph through tokio-postgres's SCRAM support.
sha2 = { version = "0.11.0", default-features = false }
# pgorm-cli = { path = "../pgorm/pgorm-cli", default-features = false, optional = true }
tracing = { version = "0.1.44", default-features = false, features = ["log"] }
futures = { version = "0.3.34", default-features = false, features = ["std"] }

[dev-dependencies]
dotenvy = "0.15.7"
# Run-scoped names for the databases the live tests create, and the sweep of
# crashed runs' leftovers (tests/common/setup.rs).
pgorm-test-support = { path = "../pgorm-test-support" }
tokio.workspace = true

[features]
default = []
